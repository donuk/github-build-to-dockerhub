name: Build, test, and publish Docker image

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker Hub image name
        required: true
        type: string

      test_script:
        description: Optional shell script to run inside the built image before publishing
        required: false
        type: string
        default: ""

    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        if: inputs.test_script != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: inputs.test_script != ''
        env:
          TEST_SCRIPT: ${{ inputs.test_script }}
        run: docker run --rm --entrypoint /bin/sh smoke-test -c "set -e; $TEST_SCRIPT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Show tags to be pushed
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Tags to be pushed to Docker Hub:"
          printf '%s\n' "$TAGS" | sed 's/^/  - /'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
